<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      width: 280px;
      padding: 20px;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0f0f23, #1a1a2e);
      color: white;
      text-align: center;
    }
    
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 3px solid #ff6b35;
      margin-bottom: 10px;
    }
    
    h2 {
      color: #ff6b35;
      font-size: 18px;
      margin-bottom: 4px;
    }
    
    .sub {
      color: #888;
      font-size: 11px;
      margin-bottom: 12px;
    }
    
    .status-box {
      background: rgba(46, 213, 115, 0.1);
      border: 1px solid rgba(46, 213, 115, 0.2);
      padding: 10px;
      border-radius: 10px;
      margin: 8px 0;
    }
    
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #2ed573;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }
    
    .status-text {
      color: #2ed573;
      font-size: 13px;
      font-weight: bold;
    }
    
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #ff6b35;
      color: white;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 6px;
    }
    
    .btn:hover {
      transform: scale(1.02);
      background: #e55a2b;
      box-shadow: 0 4px 20px rgba(255, 107, 53, 0.3);
    }
    
    .btn-outline {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
    }
    
    .btn-outline:hover {
      background: rgba(255,255,255,0.05);
      box-shadow: none;
    }
    
    .footer {
      margin-top: 12px;
      font-size: 9px;
      color: #444;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 10px;
    }
    
    .stats {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 8px 0;
    }
    
    .stat-item {
      font-size: 10px;
      color: #666;
    }
    
    .stat-item span {
      color: #ff6b35;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <img class="logo" src="icon128.png" alt="Roblox">
  
  <h2>🎮 Roblox Helper</h2>
  <div class="sub">Ускоритель загрузки изображений</div>
  
  <div class="status-box">
    <div>
      <span class="status-dot"></span>
      <span class="status-text"> Активен</span>
    </div>
    <div style="font-size: 10px; color: #666; margin-top: 4px;">
      Картинок загружено: <span id="imgCount" style="color: #2ed573;">0</span>
    </div>
  </div>
  
  <button class="btn" id="reloadImages">🔄 Обновить изображения</button>
  <button class="btn btn-outline" id="clearCache">🗑️ Очистить кэш</button>
  
  <div class="footer">
    Roblox Helper v2.0 • Работает в фоне
  </div>

  <script src="popup.js"></script>
</body>
</html>
